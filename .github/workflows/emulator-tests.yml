# QA-01: run the Kotlin tests on real Android (ART), not only on the desktop JVM.
#
# Why: the CUT-02 crash (Pattern.UNICODE_CHARACTER_CLASS, which Android's ICU-backed regex
# rejects) passed ~600 desktop-JVM tests. This job installs the debug app plus the instrumented
# tests (android/app/src/androidTest) on an x86_64 emulator at API 30 (our minSdk) and API 34 and
# runs them there. Nothing here signs in anywhere: no account, no password, no secret, no mail
# server; the fixtures are synthetic.
#
# Not continue-on-error, deliberately: a failure here fails the PR.
#
# The emulator is x86_64 while the app ships arm64-v8a only, so this job passes
# -PciEmulatorAbi=x86_64 (see android/app/build.gradle.kts). Release builds never pass it.
#
# QA-02: android-emulator-runner v2.38.0 (the newest release; no later fix exists) treats the
# emulator as booted as soon as `getprop sys.boot_completed` prints 1, then runs
# `adb shell input keyevent 82` once, unguarded and unretried, BEFORE it runs `script`
# (src/emulator-manager.ts, launchEmulator). On API 30 the input service is sometimes not yet
# published at that moment ("No service published for: input"), so the job died before any test.
# A wait inside `script` is too late, so the step "Gate boot on the input service" puts an adb
# shim first on PATH that only reports boot_completed=1 once `service check input` says found.
# The runner already polls that getprop every 2 s up to its boot timeout, so it simply waits.
# Every other adb call passes straight through; a real test failure still fails the job.

name: Emulator tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: emulator-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Android emulator tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]

    steps:
      - name: Check out
        uses: actions/checkout@v4.4.0

      # The emulator needs hardware acceleration; GitHub's Linux runners expose /dev/kvm to
      # the runner user only after this rule is added.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licences and install platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.4

      # QA-02: see the header. Shims only the runner's boot poll; everything else passes through.
      - name: Gate boot on the input service
        run: |
          mkdir -p "$RUNNER_TEMP/adb-shim"
          cat > "$RUNNER_TEMP/adb-shim/adb" <<'SHIM'
          #!/bin/sh
          REAL="$ANDROID_HOME/platform-tools/adb"
          if [ "$1" = "-s" ] && [ "$3" = "shell" ] && [ "$4" = "getprop" ] && [ "$5" = "sys.boot_completed" ]; then
            out=$("$REAL" "$@") || exit $?
            if [ "$(printf '%s' "$out" | tr -d '[:space:]')" = "1" ]; then
              svc=$("$REAL" -s "$2" shell service check input 2>&1 | tr -d '\r')
              case "$svc" in
                *"not found"*|"") echo "QA-02: boot_completed=1 but the input service is not published yet" >&2; echo 0; exit 0 ;;
              esac
              case "$svc" in
                *found*) ;;
                *) echo "QA-02: input service not published yet ($svc)" >&2; echo 0; exit 0 ;;
              esac
            fi
            printf '%s\n' "$out"
            exit 0
          fi
          exec "$REAL" "$@"
          SHIM
          chmod +x "$RUNNER_TEMP/adb-shim/adb"
          echo "$RUNNER_TEMP/adb-shim" >> "$GITHUB_PATH"

      - name: Cache the AVD
        id: avd-cache
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ matrix.api-level }}-x86_64-google_apis

      # First run for a key only: boot once and save a snapshot so later runs start warm.
      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Run the instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -PciEmulatorAbi=x86_64 --console=plain

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: emulator-report-api${{ matrix.api-level }}
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore
