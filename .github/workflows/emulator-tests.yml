# QA-01: run the Kotlin tests on real Android (ART), not only on the desktop JVM.
#
# Why: the CUT-02 crash (Pattern.UNICODE_CHARACTER_CLASS, which Android's ICU-backed regex
# rejects) passed ~600 desktop-JVM tests. This job installs the debug app plus the instrumented
# tests (android/app/src/androidTest) on an x86_64 emulator at API 30 (our minSdk) and API 34 and
# runs them there. Nothing here signs in anywhere: no account, no password, no secret, no mail
# server; the fixtures are synthetic.
#
# Not continue-on-error, deliberately: a failure here fails the PR.
#
# The emulator is x86_64 while the app ships arm64-v8a only, so this job passes
# -PciEmulatorAbi=x86_64 (see android/app/build.gradle.kts). Release builds never pass it.
#
# QA-02: android-emulator-runner v2.38.0 (the newest release; no later fix exists) treats the
# emulator as booted as soon as `getprop sys.boot_completed` prints 1, then runs
# `adb shell input keyevent 82` once, unguarded and unretried, BEFORE it runs `script`
# (src/emulator-manager.ts, launchEmulator). On API 30 the input service is sometimes not yet
# published at that moment ("No service published for: input"), so the job died before any test.
# A wait inside `script` is too late, and the runner prepends platform-tools to PATH itself, so
# pre-emulator-launch-script wraps platform-tools/adb (.github/emulator/install-adb-gate.sh): it
# only reports boot_completed=1 once `service check input` says found.
# The runner already polls that getprop every 2 s up to its boot timeout, so it simply waits.
# Every other adb call passes straight through; a real test failure still fails the job.
#
# D74: on main (run 39934172996) the API 30 input service never came up at all: boot_completed
# was 1, the gate kept answering 0, and the runner gave up with "Timeout waiting for emulator to
# boot" after 600 s. Re-running only that job passed, so the emulator step is run a second time,
# but ONLY for that case. Attempt 1 is continue-on-error and its script starts with a marker file,
# which exists only once the emulator booted and the runner reached `script`. Attempt 2 runs only
# when attempt 1 failed and the marker is absent (a boot timeout). A failure after the marker (a
# real test failure) is never retried: the last step turns it into a red job. The boot timeout
# is 300 s (a warm boot takes 10-13 s, measured over 26 jobs on both API levels).

name: Emulator tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: emulator-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Android emulator tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]

    steps:
      - name: Check out
        uses: actions/checkout@v4.4.0

      # The emulator needs hardware acceleration; GitHub's Linux runners expose /dev/kvm to
      # the runner user only after this rule is added.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licences and install platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.4

      - name: Cache the AVD
        id: avd-cache
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ matrix.api-level }}-x86_64-google_apis

      # First run for a key only: boot once and save a snapshot so later runs start warm.
      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          pre-emulator-launch-script: sh "$GITHUB_WORKSPACE/.github/emulator/install-adb-gate.sh"
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Run the instrumented tests on the emulator
        id: emu1
        uses: reactivecircus/android-emulator-runner@v2.38.0
        continue-on-error: true
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-boot-timeout: 0
          pre-emulator-launch-script: sh "$GITHUB_WORKSPACE/.github/emulator/install-adb-gate.sh"
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: |
            touch "$RUNNER_TEMP/emulator-booted"
            ./gradlew :app:connectedDebugAndroidTest -PciEmulatorAbi=x86_64 --console=plain

      # Did attempt 1 get as far as running `script`? The marker is its first line.
      - name: Did the emulator boot on attempt 1
        id: boot
        if: steps.emu1.outcome == 'failure'
        run: |
          if [ -f "$RUNNER_TEMP/emulator-booted" ]; then
            echo "booted=true" >> "$GITHUB_OUTPUT"
            echo "Attempt 1 booted and then failed: a real failure, no retry."
          else
            echo "booted=false" >> "$GITHUB_OUTPUT"
            echo "Attempt 1 never reached the test script (boot timeout): retrying once."
          fi

      - name: Retry the emulator step once (boot timeout only)
        if: steps.emu1.outcome == 'failure' && steps.boot.outputs.booted == 'false'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-boot-timeout: 300
          pre-emulator-launch-script: sh "$GITHUB_WORKSPACE/.github/emulator/install-adb-gate.sh"
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: |
            touch "$RUNNER_TEMP/emulator-booted"
            ./gradlew :app:connectedDebugAndroidTest -PciEmulatorAbi=x86_64 --console=plain

      - name: Fail the job on a real test failure
        if: steps.emu1.outcome == 'failure' && steps.boot.outputs.booted == 'true'
        run: |
          echo "The emulator booted and the instrumented tests failed on attempt 1."
          exit 1

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: emulator-report-api${{ matrix.api-level }}
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore
