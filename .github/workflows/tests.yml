# Test suite.
#
# Added 2026-08-07, after a lock-only Dependabot PR (#3, cryptography 49 -> 50)
# arrived showing three green checks, none of which knew whether the app still
# worked: codeql.yml was the repository's only workflow. Validating that PR
# meant building a venv and running the suite by hand. This removes that step.
#
# It installs requirements-lock.txt with --require-hashes. Testing the loose
# pins in requirements.txt would let a lock-only bump pass CI while shipping
# something untested -- and lock-only PRs are the majority of what Dependabot
# opens here.
#
# The job pins 3.13 (the version the Kotlin port was written against; the app no
# longer embeds Python). Kept as a one-entry matrix (rather than a
# plain python-version step) so another target is one entry away if it's
# ever needed.
#
# Note on failure modes: no step here uses continue-on-error, deliberately.
# pytest exits non-zero for collection errors (2) and "no tests collected" (5)
# as well as plain failures (1), so a suite that silently stops existing fails
# the job instead of passing it.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # The check name is frozen (D57), so it still says "matches Chaquopy" even
          # though the app no longer embeds a Python runtime.
          - name: Linux (3.13, matches Chaquopy)
            os: ubuntu-latest
            python-version: "3.13"

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # --require-hashes: if a lock entry is
      # missing a hash, or a hash does not match, this fails rather than
      # quietly resolving something else.
      - name: Install pinned dependencies from the lock file
        run: python -m pip install --require-hashes -r requirements-lock.txt

      # Dev-only, never bundled into the app, so kept out of the lock.
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency graph is consistent
        run: python -m pip check

      # tests/ explicitly: a bare `pytest` from the repo root can also collect
      # the vendored certifi tests under android/app/build/python/, which are
      # build output, not this project's tests.
      #
      # -rs prints the reason for every skip, so a test that starts skipping
      # says so in the log instead of hiding in a count.
      - name: Run tests
        run: python -m pytest tests -q -rs --strict-markers

      # The Kotlin :core tests compare against golden files produced by the
      # real Python code. Nothing checked that the files were still what that
      # code produces, so a Python change could leave them quietly stale.
      # This regenerates every golden into a temp dir and fails on any
      # difference (SQLite files by content, everything else byte for byte).
      - name: Golden fixtures are current
        env:
          PYTHONPATH: .
        run: |
          python tools/generate_kotlin_core_golden_fixtures.py --out "$RUNNER_TEMP/golden"
          python tools/check_golden_fixtures.py "$RUNNER_TEMP/golden" android/core/src/test/resources/golden

  # The Kotlin unit test suite (android/app/src/test/...). It exists as a
  # separate job rather than a step above because it needs the whole Android
  # toolchain -- JDK and SDK platform -- and
  # because it must be able to fail on its own terms.
  #
  # Several of these tests assert the same contract from the Kotlin side that
  # a pytest file asserts from the Python side (e.g. FrozenIdentifiersTest
  # alongside tests/test_config.py) -- a parity rule that only one platform
  # actually checks is a comment, not a rule.
  #
  # JVM unit tests -- no emulator. Three classes use Robolectric, which downloads
  # its android-all jar on first use (cached below).
  android-unit-tests:
    name: Android unit tests (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 17 matches sourceCompatibility/jvmTarget in
      # android/app/build.gradle.kts, as codeql.yml does.
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licences and install platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Robolectric 4.18 (MavenDependencyResolver.getLocalRepositoryDir) keeps the
      # android-all jar it downloads in the local Maven repository: -Dmaven.repo.local,
      # else localRepository in ~/.m2/settings.xml, else ~/.m2/repository. Neither is
      # set here, so it is ~/.m2/repository. Cache only the org/robolectric part. The key
      # changes with the Robolectric version (app/build.gradle.kts) and the SDK
      # (robolectric.properties), so either change downloads a fresh jar. A cache miss
      # still works: Robolectric downloads the jar itself, as before.
      - name: Cache Robolectric android-all jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts', 'android/app/src/test/resources/robolectric.properties') }}

      - name: Show Robolectric jars before the tests
        run: |
          find ~/.m2/repository/org/robolectric -name '*.jar' -ls 2>/dev/null || true
          echo "listing done"

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :core:test --no-daemon --stacktrace

      # LIC-02: junit:junit is EPL-1.0 and test-only. JunitTestOnlyGuardTest reads the build files;
      # this checks what Gradle actually resolves for the shipped (release) runtime classpaths.
      - name: Fail if JUnit reaches a shipped classpath
        working-directory: android
        run: |
          for task in ":app:dependencies --configuration releaseRuntimeClasspath" ":core:dependencies --configuration runtimeClasspath"; do
            ./gradlew $task --no-daemon --console=plain > "$RUNNER_TEMP/deps.txt"
            if grep -i 'junit' "$RUNNER_TEMP/deps.txt"; then
              echo "::error::junit is on a shipped classpath ($task)"
              exit 1
            fi
          done
