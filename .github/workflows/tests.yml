# Test suite.
#
# Added 2026-08-07, after a lock-only Dependabot PR (#3, cryptography 49 -> 50)
# arrived showing three green checks, none of which knew whether the app still
# worked: codeql.yml was the repository's only workflow. Validating that PR
# meant building a venv and running the suite by hand. This removes that step.
#
# It installs requirements-lock.txt with --require-hashes. Testing the loose
# pins in requirements.txt would let a lock-only bump pass CI while shipping
# something untested -- and lock-only PRs are the majority of what Dependabot
# opens here.
#
# The job pins 3.13 to match the Chaquopy runtime in
# android/app/build.gradle.kts. Kept as a one-entry matrix (rather than a
# plain python-version step) so another target is one entry away if it's
# ever needed.
#
# Note on failure modes: no step here uses continue-on-error, deliberately.
# pytest exits non-zero for collection errors (2) and "no tests collected" (5)
# as well as plain failures (1), so a suite that silently stops existing fails
# the job instead of passing it.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Matches chaquopy { defaultConfig { version = "3.13" } }.
          - name: Linux (3.13, matches Chaquopy)
            os: ubuntu-latest
            python-version: "3.13"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # --require-hashes: if a lock entry is
      # missing a hash, or a hash does not match, this fails rather than
      # quietly resolving something else.
      - name: Install pinned dependencies from the lock file
        run: python -m pip install --require-hashes -r requirements-lock.txt

      # Dev-only, never bundled into the app, so kept out of the lock.
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency graph is consistent
        run: python -m pip check

      # tests/ explicitly: a bare `pytest` from the repo root can also collect
      # the vendored certifi tests under android/app/build/python/, which are
      # build output, not this project's tests.
      #
      # -rs prints the reason for every skip, so a test that starts skipping
      # says so in the log instead of hiding in a count.
      - name: Run tests
        run: python -m pytest tests -q -rs --strict-markers

  # The Kotlin unit test suite (android/app/src/test/...). It exists as a
  # separate job rather than a step above because it needs the whole Android
  # toolchain -- JDK, SDK platform, and a host Python for Chaquopy -- and
  # because it must be able to fail on its own terms.
  #
  # Several of these tests assert the same contract from the Kotlin side that
  # a pytest file asserts from the Python side (e.g. FrozenIdentifiersTest
  # alongside tests/test_config.py) -- a parity rule that only one platform
  # actually checks is a comment, not a rule.
  #
  # Plain JVM unit tests -- no emulator, no Robolectric.
  android-unit-tests:
    name: Android unit tests (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # JDK 17 matches sourceCompatibility/jvmTarget in
      # android/app/build.gradle.kts, as codeql.yml does.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a host Python matching chaquopy { version = "3.13" },
      # even for a unit-test build, because the debug variant it compiles
      # against carries the Python source set.
      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Accept SDK licences and install platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :core:test --no-daemon --stacktrace
