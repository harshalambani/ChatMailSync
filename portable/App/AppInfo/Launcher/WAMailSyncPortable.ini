; PortableApps.com Launcher configuration for WA Mail Sync.
;
; The file name must match [Details]:AppID in appinfo.ini - the generator
; looks for App\AppInfo\Launcher\<AppID>.ini and emits <AppID>.exe at the
; package root. Rename one without the other and the generator silently
; builds a launcher with no configuration.
;
; This replaces the old WAMailSyncPortable.bat. A .bat cannot carry an icon,
; which is the whole reason the icon set generated in B2 was doing nothing
; for the portable bundle.

[Launch]
; Relative to App\, so this resolves to App\WAMailSync\WAMailSync.exe -
; the PyInstaller onedir bundle that build_portable.ps1 assembles.
ProgramExecutable=WAMailSync\WAMailSync.exe

; The app is a long-running GUI that owns its own sync worker threads. Let
; the launcher wait for it so the temp directory is cleaned up on exit.
WaitForProgram=true

; There is no "locally installed" WA Mail Sync to collide with - the only
; distribution is this portable package - so the single-instance check
; against a local copy is meaningless here and would only produce a
; confusing error if a user ran two portable copies from different drives.
SingleAppInstance=false

; SinglePortableAppInstance is deliberately left unset, and the reason is a
; trap rather than a preference. WaitForProgram=true is already set above, so
; the launcher stays alive until the app process exits; turning on the
; portable-instance mutex would make that tail block a relaunch. Measured
; 2026-08-08: window close -> app process gone in 370-420 ms, and a relaunch
; fired the instant the process disappeared came up clean in 2,933 ms. That
; margin only holds while every worker thread stays daemon=True (see
; gui_worker.py) - a non-daemon thread that outlives the window would turn
; this setting into "the app will not reopen for N seconds" with no error
; message to explain it.

; All state lives under Data\ and is addressed through WAMAILSYNC_ROOT
; below, so nothing is baked into an absolute path and the package survives
; being moved between drives or directories.
DirectoryMoveOK=yes

; Untested over UNC. sqlite over SMB is exactly the kind of thing that
; corrupts quietly rather than failing loudly, so warn rather than claim
; support we have not verified.
SupportsUNC=warn

; SplashTime is a DURATION, not a ready signal. Nothing dismisses the splash
; when the window actually appears: it shows for exactly this long and then
; goes, so the number has to be chosen against measured start times.
;
; Measured 2026-08-08 on a clean extraction of WAMailSyncPortable_1.0.1.zip,
; launcher start -> first visible top-level window:
;   cold (first run after extraction)  8,135 ms
;   warm                               2,808 / 2,933 / 2,998 / 3,005 ms
;
; 2500 sits just under the *lowest* warm figure. Undershooting leaves a few
; hundred ms of bare desktop, which reads as "still loading". Overshooting is
; worse: the splash is topmost, so it would park an image over a window the
; user can already type into. Cold start is deliberately left uncovered -
; sizing for 8s would mean a 5s image sitting over a usable window on every
; ordinary launch, to improve the one launch in a hundred that is cold.
;
; Deliberately NOT setting LaunchAppAfterSplash: despite the name, it runs the
; splash to completion *before* starting the app, which adds this duration to
; the start time instead of hiding it.
SplashTime=2500

[Environment]
; The frozen app resolves auth/, data/inbox/ and data/processed/ relative to
; this root (src/config.py:_compute_root). %PAL:DataDir% is the package's
; Data\ directory, which is exactly what the retired .bat used to set.
WAMAILSYNC_ROOT=%PAL:DataDir%
