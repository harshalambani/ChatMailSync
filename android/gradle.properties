org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# AGP 9.0+ built-in Kotlin support conflicts with the separate
# org.jetbrains.kotlin.android plugin this project still uses (matching
# Chaquopy's documented setup examples). Opt out via the official escape
# hatch; revisit when Chaquopy's docs/examples catch up to built-in Kotlin.
# Slated for removal in AGP 10.0 per Google's own release notes.
android.builtInKotlin=false
android.newDsl=false
